<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./bill.css">
    <script src="./bill.js "defer></script>
</head>
<body>
    <main>
        <H1 class="h">Billing Software</H1>
    <div id="one">
        
        <div class="left">
            <div class="addproduct">
                <h1>Add product</h1>
                <input type="text" placeholder="Product Name">
                <input type="number" placeholder="Available Qty">
                <input type="number" placeholder="Price">
                <Button>Add</Button>

            </div>
            <div class="searchproduct">
                
                     <h1>Search Product</h1>
                    <input type="text" placeholder="Type Product Name..">
                
                 
                <table border="l">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Price</th>
                            <th>Add</th>
                            <th>Del</th>
                        </tr>
                    </thead>
                </table>
            </div>
        </div>
        <div class="right">
            
            <h1>Bill</h1>
            <table border="">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Qty</th>
                        <th>Amount</th>
                    </tr>
                </thead>
            </table>
                
            <h2>Subtotal:$0</h2>
            <h2>GST(18%):$0</h2>
            <h2>Total:$0</h2>

        </div>

    </div>
    </main>
</body>
</html>
